[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "naver-selenium-scrapers"
version = "0.1.0"
description = "Selenium scrapers for Naver Map and Naver Real Estate examples"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "beautifulsoup4>=4.12.0",
  "pandas>=2.0.0",
  "selenium>=4.18.0",
  "tqdm>=4.66.0",
]

[project.scripts]
naver-map-cafes = "naver_scraper.naver_map_cafes:main"
naver-real-estate = "naver_scraper.naver_real_estate:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
